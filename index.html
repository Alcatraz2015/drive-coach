<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Only this site's own code can run; the app may only talk to the map, routing and search services listed here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org https://tile.openstreetmap.org https://router.project-osrm.org https://nominatim.openstreetmap.org https://overpass-api.de https://overpass.private.coffee https://overpass.kumi.systems; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drive Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Teach someone to drive: live map, checkpoint routes, skill board and lesson reports.">
<title>Drive Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <div id="map">
    <div class="banner" id="placeBanner" hidden>Tap the map to drop checkpoint pins</div>
    <div class="fab">
      <button id="locBtn" aria-pressed="false" aria-label="Follow my location" title="Follow my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button id="bigBtn" aria-pressed="false" aria-label="Bigger map" title="Bigger map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button id="fitBtn" aria-label="Show whole route" title="Show whole route">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="6" r="2.2"/><path d="M7 17c4-1 2-6 6-7s3-3 4-3"/></svg>
      </button>
      <button id="voiceBtn" class="voice" aria-pressed="true" aria-label="Voice on" hidden></button>
    </div>
  </div>
  <section class="sheet">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="drive" aria-selected="true">Drive</button>
      <button role="tab" data-tab="routes" aria-selected="false">Routes</button>
      <button role="tab" data-tab="skills" aria-selected="false">Skills</button>
      <button role="tab" data-tab="log" aria-selected="false">Log</button>
    </div>
    <div class="pane" id="pane"><div class="empty">Loading…</div></div>
  </section>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<noscript>Drive Coach needs JavaScript turned on.</noscript>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="vendor/maplibre/leaflet-maplibre-gl.js"></script>
<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/store.js"></script>
<script src="js/mapstyle.js"></script>
<script src="js/osm.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
</body>
</html>
