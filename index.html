<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drive Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Teach someone to drive: live map, checkpoint routes, skill board and lesson reports.">
<title>Drive Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass:wght@600;800;900&family=Overpass+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <div id="map">
    <div class="banner" id="placeBanner" hidden>Tap the map to drop checkpoint pins</div>
    <div class="fab">
      <button id="locBtn" aria-pressed="false" aria-label="Follow my location" title="Follow my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button id="fitBtn" aria-label="Show whole route" title="Show whole route">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button id="voiceBtn" class="voice" aria-pressed="true" aria-label="Voice on" hidden></button>
    </div>
  </div>
  <section class="sheet">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="drive" aria-selected="true">Drive</button>
      <button role="tab" data-tab="routes" aria-selected="false">Routes</button>
      <button role="tab" data-tab="skills" aria-selected="false">Skills</button>
      <button role="tab" data-tab="log" aria-selected="false">Log</button>
    </div>
    <div class="pane" id="pane"><div class="empty">Loading…</div></div>
  </section>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<noscript>Drive Coach needs JavaScript turned on.</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/store.js"></script>
<script src="js/osm.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
</body>
</html>
