name: Update map data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 3:17 a.m. Calgary time
  push:
    paths: ["scripts/build_osm_data.py", ".github/workflows/osm-data.yml"]
permissions:
  contents: write
concurrency:
  group: osm-data
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install osmium
      - name: Download Alberta from Geofabrik and cut out the Calgary region
        run: |
          curl -fsSL --retry 3 -o alberta.osm.pbf https://download.geofabrik.de/north-america/canada/alberta-latest.osm.pbf
          ls -lh alberta.osm.pbf
          osmium extract -b -114.50,50.70,-113.70,51.36 --strategy complete_ways alberta.osm.pbf -o region.osm.pbf
          ls -lh region.osm.pbf
      - run: python scripts/build_osm_data.py region.osm.pbf
      - run: du -sh data/osm && ls data/osm/f | wc -l && ls data/osm/r | wc -l
      - name: Commit if changed
        run: |
          git config user.name "drive-coach-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -q -m "Update OpenStreetMap data for the Calgary region"
          git pull -q --rebase origin main
          git push
