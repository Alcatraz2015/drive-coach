name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Syntax check
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Logic tests
        run: node --test tests/*.test.js
